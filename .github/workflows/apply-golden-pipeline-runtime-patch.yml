name: Apply Golden Pipeline Runtime Patch
on:
  push:
    branches:
      - fix/golden-pipeline-interactions-2026-08-21
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/golden-pipeline-interactions-2026-08-21
          fetch-depth: 1
      - name: Patch runtime
        shell: python
        run: |
          from pathlib import Path
          p = Path('filin-master-product-v3-3-2-golden-standard-runtime.js')
          s = p.read_text(encoding='utf-8')
          start = s.index("  function apply(){\n    var p=profile();")
          end = s.index("  window.FilinMasterProductV3=", start)
          replacement = '''  function applyGoldenStandard(profileOverride){
    var p=profileOverride||profile();
    if(!p){
      console.warn('[Master Product V3] profile not found for slug',slug());
      return false;
    }

    if(window.FLPipeline && !window.FLPipeline.claim('golden:' + p.slug)) return false;

    var buildGolden=function(){
      document.documentElement.setAttribute('data-filin-master-v3','1');
      installCSS();
      bindHero(p);
      bindCurator(p);
      build(p);
      updateSticky(p);
    };

    if(window.FLPipeline && typeof window.FLPipeline.mutate==='function'){
      window.FLPipeline.mutate(buildGolden);
    }else{
      buildGolden();
    }

    console.info('[Master Product V3] GOLDEN STANDARD APPLIED',{
      version:VERSION,
      slug:p.slug,
      price:p.commerce.basePrice
    });

    window.FLPipeline && window.FLPipeline.ready({slug:p.slug});
    return true;
  }

  function apply(){
    return applyGoldenStandard(profile());
  }

'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
      - name: Verify and commit
        shell: bash
        run: |
          grep -n "function applyGoldenStandard" filin-master-product-v3-3-2-golden-standard-runtime.js
          grep -n "FLPipeline.*claim('golden:'" filin-master-product-v3-3-2-golden-standard-runtime.js
          grep -n "FLPipeline.*ready" filin-master-product-v3-3-2-golden-standard-runtime.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filin-master-product-v3-3-2-golden-standard-runtime.js
          git commit -m "Wire Golden build through FLPipeline"
          git push origin HEAD:fix/golden-pipeline-interactions-2026-08-21
