name: Apply Golden Pipeline Patch (temporary)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/golden-pipeline-interactions-2026-08-21' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/golden-pipeline-interactions-2026-08-21
          fetch-depth: 1

      - name: Patch Golden runtime and registry
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('filin-master-product-v3-3-2-golden-standard-runtime.js')
          s = runtime.read_text(encoding='utf-8')
          start = s.index("  function apply(){\n    var p=profile();")
          end = s.index("  window.FilinMasterProductV3=", start)
          replacement = '''  function applyGoldenStandard(profileOverride){
    var p=profileOverride||profile();
    if(!p){
      console.warn('[Master Product V3] profile not found for slug',slug());
      return false;
    }

    if(window.FLPipeline && !window.FLPipeline.claim('golden:' + p.slug)) return false;

    var buildGolden=function(){
      document.documentElement.setAttribute('data-filin-master-v3','1');
      installCSS();
      bindHero(p);
      bindCurator(p);
      build(p);
      updateSticky(p);
    };

    if(window.FLPipeline && typeof window.FLPipeline.mutate==='function'){
      window.FLPipeline.mutate(buildGolden);
    }else{
      buildGolden();
    }

    console.info('[Master Product V3] GOLDEN STANDARD APPLIED',{
      version:VERSION,
      slug:p.slug,
      price:p.commerce.basePrice
    });

    window.FLPipeline && window.FLPipeline.ready({slug:p.slug});
    return true;
  }

  function apply(){
    return applyGoldenStandard(profile());
  }

'''
          runtime.write_text(s[:start] + replacement + s[end:], encoding='utf-8')

          registry = Path('filin-master-product-v3-profiles-registry-v1.js')
          r = registry.read_text(encoding='utf-8')
          duplicate = "    if(IX.root!==root){\n      root.addEventListener('click',onGalleryClick);\n    }\n\n    bindGallery(root);"
          wanted = "    bindGallery(root);"
          if duplicate not in r:
              raise SystemExit('Expected registry duplicate click delegation not found')
          r = r.replace(duplicate, wanted, 1)
          registry.write_text(r, encoding='utf-8')

          Path('.github/workflows/_apply-golden-pipeline-pr.yml').unlink()

      - name: Verify patched files
        shell: bash
        run: |
          node --check filin-master-product-v3-3-2-golden-standard-runtime.js
          node --check filin-master-product-v3-profiles-registry-v1.js
          grep -n "function applyGoldenStandard" filin-master-product-v3-3-2-golden-standard-runtime.js
          grep -n "FLPipeline.*claim('golden:'" filin-master-product-v3-3-2-golden-standard-runtime.js
          grep -n "FLPipeline.*ready" filin-master-product-v3-3-2-golden-standard-runtime.js
          grep -n "filin:product:ready" filin-master-product-v3-profiles-registry-v1.js
          git diff --check

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- filin-master-product-v3-3-2-golden-standard-runtime.js filin-master-product-v3-profiles-registry-v1.js .github/workflows/_apply-golden-pipeline-pr.yml
          git diff --cached --check
          git commit -m "Wire Golden build through FLPipeline"
          git push origin HEAD:fix/golden-pipeline-interactions-2026-08-21
